<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Rô-bốt Nhà Kho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/mascot.css" />
  <link rel="stylesheet" href="../shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <p id="question" class="question card"></p>

    <div class="warehouse">
      <div class="robot" id="robot">🤖</div>
      <div id="boxes" class="boxes"></div>
    </div>

    <div class="card code-card">
      <div class="label" id="codeLabel">📜 Chương trình của rô-bốt</div>
      <ol id="code" class="code"></ol>
    </div>

    <div id="buildArea" class="card hidden">
      <div class="label">🧩 Thẻ lệnh <small>(chạm để thêm vào chương trình, chạm dòng lệnh để gỡ)</small></div>
      <div id="cards" class="cards"></div>
      <div class="controls">
        <button id="clearBtn" class="btn ghost">🧹 Xóa hết</button>
        <button id="runBtn" class="btn go">▶ Chạy</button>
      </div>
    </div>

    <div id="choices" class="choices"></div>
  </div>

  <script src="../shared/mascot.js"></script>
  <script src="../shared/bridge.js"></script>
  <script src="../shared/kit.js"></script>
  <script src="game.js"></script>
</body>
</html>
