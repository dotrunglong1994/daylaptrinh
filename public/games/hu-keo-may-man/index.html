<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Hũ Kẹo May Mắn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/mascot.css" />
  <link rel="stylesheet" href="../shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <p id="question" class="question card"></p>
    <div id="jars" class="jars"></div>
    <div id="palette" class="controls"></div>
    <div id="fillRow" class="controls">
      <button id="checkBtn" class="btn go">✅ Xong</button>
    </div>
    <div id="choices" class="choices"></div>
    <div class="card draw-card">
      <button id="drawBtn" class="btn ghost">🎲 Nhắm mắt bốc thử</button>
      <div id="tally" class="tally"></div>
    </div>
  </div>

  <script src="../shared/mascot.js"></script>
  <script src="../shared/bridge.js"></script>
  <script src="../shared/kit.js"></script>
  <script src="game.js"></script>
</body>
</html>
