<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Đường Đua Vận Tốc</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/mascot.css" />
  <link rel="stylesheet" href="../shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <p id="question" class="question card"></p>
    <div class="track card">
      <div class="track-top"><span id="timer" class="timer">⏱ 0 giờ</span></div>
      <div id="road" class="road"><span id="flag" class="flag">🏁</span></div>
      <div class="track-labels"><span id="startLbl"></span><span id="endLbl"></span></div>
    </div>
    <div id="speedControls" class="controls speed">
      <button class="btn ghost" data-dv="-10">⏪ −10</button>
      <button class="btn ghost" data-dv="-5">◀ −5</button>
      <b id="speedVal" class="speed-val"></b>
      <button class="btn ghost" data-dv="5">+5 ▶</button>
      <button class="btn ghost" data-dv="10">+10 ⏩</button>
    </div>
    <div id="runRow" class="controls">
      <button id="runBtn" class="btn go">🏁 Chạy</button>
    </div>
    <div id="choices" class="choices"></div>
  </div>

  <script src="../shared/mascot.js"></script>
  <script src="../shared/bridge.js"></script>
  <script src="../shared/kit.js"></script>
  <script src="game.js"></script>
</body>
</html>
