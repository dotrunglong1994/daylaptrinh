<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Đồng Hồ Thần Kỳ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/mascot.css" />
  <link rel="stylesheet" href="../shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <p id="question" class="question card"></p>
    <div class="clock-wrap">
      <svg id="clock" class="clock" viewBox="0 0 200 200" aria-label="Đồng hồ">
        <circle cx="100" cy="100" r="94" class="rim" />
        <circle cx="100" cy="100" r="86" class="face" />
        <g id="ticks"></g>
        <g id="numbers"></g>
        <g id="hourHand" class="hand hour" data-hand="hour">
          <line x1="100" y1="100" x2="100" y2="52" class="hit" />
          <line x1="100" y1="108" x2="100" y2="52" class="ink" />
        </g>
        <g id="minuteHand" class="hand minute" data-hand="minute">
          <line x1="100" y1="100" x2="100" y2="24" class="hit" />
          <line x1="100" y1="112" x2="100" y2="24" class="ink" />
        </g>
        <circle cx="100" cy="100" r="6" class="pin" />
      </svg>
    </div>
    <div id="setControls" class="controls">
      <button class="btn ghost" data-step="-60">⏪ 1 giờ</button>
      <button class="btn ghost" data-step="-1" id="minusBtn"></button>
      <button class="btn ghost" data-step="1" id="plusBtn"></button>
      <button class="btn ghost" data-step="60">1 giờ ⏩</button>
    </div>
    <div id="checkRow" class="controls">
      <button id="checkBtn" class="btn go">✅ Kiểm tra</button>
    </div>
    <div id="choices" class="choices"></div>
  </div>

  <script src="../shared/mascot.js"></script>
  <script src="../shared/bridge.js"></script>
  <script src="../shared/kit.js"></script>
  <script src="game.js"></script>
</body>
</html>
