<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Robot Tìm Đường</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/mascot.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Màn hình chọn màn -->
  <section id="levels" class="screen">
    <div class="panel">
      <div class="dino menu-dino" data-dino></div>
      <h1>🤖 Robot Tìm Đường</h1>
      <p class="sub">Xếp các lệnh để đưa robot tới kho báu 💎</p>
      <div id="levelGrid" class="level-grid"></div>
    </div>
  </section>

  <!-- Màn hình chơi -->
  <section id="play" class="screen hidden">
    <header class="hud">
      <button id="backBtn" class="icon" title="Chọn màn">🗺️</button>
      <h2 id="levelTitle"></h2>
      <button id="soundBtn" class="icon" title="Âm thanh">🔊</button>
    </header>

    <div class="guide">
      <div id="mascot" class="dino mascot" data-dino></div>
      <div id="bubble" class="bubble"></div>
    </div>

    <div id="boardWrap" class="board-wrap">
      <div id="board" class="board"></div>
    </div>

    <div class="program-area">
      <div class="program-head">
        <span>📜 Chương trình</span>
        <span id="slotInfo"></span>
      </div>
      <div id="program" class="program"></div>
    </div>

    <div class="controls">
      <div class="palette">
        <button data-dir="up" title="Đi lên">⬆️</button>
        <button data-dir="left" title="Sang trái">⬅️</button>
        <button data-dir="down" title="Đi xuống">⬇️</button>
        <button data-dir="right" title="Sang phải">➡️</button>
      </div>
      <div class="actions">
        <button id="clearBtn" class="btn ghost">🗑️ Xóa</button>
        <button id="runBtn" class="btn go">▶️ Chạy</button>
      </div>
    </div>
  </section>

  <!-- Bảng thắng màn -->
  <div id="winModal" class="modal hidden">
    <div class="panel">
      <h1>Tìm được kho báu! 💎</h1>
      <div id="winStars" class="stars"></div>
      <p id="winText" class="sub"></p>
      <div class="row">
        <button id="replayBtn" class="btn ghost">🔁 Chơi lại</button>
        <button id="nextBtn" class="btn go">Màn tiếp ➡️</button>
      </div>
    </div>
  </div>

  <script src="../shared/mascot.js"></script>
  <script src="../shared/bridge.js"></script>
  <script src="game.js"></script>
</body>
</html>
